# ============================================================================
#  Configuracion de la aplicacion (MicroProfile Config).
#  Cada clave admite override por variable de entorno (mayusculas y '_'),
#  p. ej.  app.security.max-login-attempts  ->  APP_SECURITY_MAX_LOGIN_ATTEMPTS
# ============================================================================

# --- Seguridad / autenticacion ---
app.security.bcrypt-cost=12
app.security.max-login-attempts=5
app.security.lockout-minutes=30
app.security.session-timeout-minutes=30
app.security.password-min-length=8

# --- Paginacion (lectura optimizada de grandes volumenes) ---
app.pagination.default-size=25
app.pagination.max-size=200

# --- Auditoria ---
app.audit.enabled=true
app.audit.retention-days=180

# --- Reglas de negocio de horario ---
app.schedule.day-start-hour=6
app.schedule.day-end-hour=22
app.schedule.max-block-duration=8

# --- OpenAPI ---
mp.openapi.extensions.enabled=true
