<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition template="/WEB-INF/plantilla/plantilla.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:t="http://tesiscalidad/ui">

    <ui:param name="pageTitle" value="Materias"/>

    <ui:define name="contenido">
        <h:form id="form">
            <p:panel styleClass="panel-elevado">
                <f:facet name="header"><i class="pi pi-book"></i> Catalogo de materias</f:facet>

                <p:toolbar style="margin-bottom:1rem;border:0;background:transparent">
                    <p:toolbarGroup>
                        <p:commandButton value="Nueva materia" icon="pi pi-plus" styleClass="p-button-success js-ripple"
                                         actionListener="#{materiaBean.nuevo}" process="@this"
                                         update=":dlg" oncomplete="PF('dlg').show()"
                                         rendered="#{sesionUsuarioBean.puedeGestionar}"/>
                    </p:toolbarGroup>
                    <p:toolbarGroup align="right">
                        <p:inputText value="#{materiaBean.filtroTexto}" placeholder="Buscar codigo o nombre">
                            <p:ajax event="keyup" listener="#{materiaBean.aplicarFiltro}" update="tabla" delay="400"/>
                        </p:inputText>
                        <p:selectOneMenu value="#{materiaBean.filtroSemestre}" style="margin-left:.5rem">
                            <f:selectItem itemLabel="Todos los semestres" itemValue="#{null}"/>
                            <f:selectItems value="#{catalogos.semestres}"/>
                            <p:ajax listener="#{materiaBean.aplicarFiltro}" update="tabla"/>
                        </p:selectOneMenu>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="tabla" value="#{materiaBean.modelo}" var="m" lazy="true"
                             paginator="true" rows="10" rowsPerPageTemplate="10,25,50"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords}"
                             size="small" stripedRows="true" emptyMessage="Sin materias">
                    <p:column headerText="Codigo" sortBy="#{m.codigo}" width="110">
                        <t:pill value="#{m.codigo}" severity="info"/>
                    </p:column>
                    <p:column headerText="Nombre">#{m.nombre}</p:column>
                    <p:column headerText="Tipo" width="120">#{m.tipoEtiqueta}</p:column>
                    <p:column headerText="Cred." width="70" style="text-align:center">#{m.creditos}</p:column>
                    <p:column headerText="IH" width="60" style="text-align:center">#{m.intensidadHoraria}</p:column>
                    <p:column headerText="Sem." width="70" style="text-align:center">#{m.semestre}</p:column>
                    <p:column headerText="Estado" width="100">
                        <t:pill value="#{m.activa ? 'Activa' : 'Inactiva'}"
                               severity="#{m.activa ? 'success' : 'danger'}"/>
                    </p:column>
                    <p:column headerText="Acciones" width="170" style="text-align:center"
                              rendered="#{sesionUsuarioBean.puedeGestionar}">
                        <p:commandButton icon="pi pi-pencil" styleClass="p-button-rounded p-button-text"
                                         title="Editar" actionListener="#{materiaBean.editar(m)}" process="@this"
                                         update=":dlg" oncomplete="PF('dlg').show()"/>
                        <p:commandButton icon="#{m.activa ? 'pi pi-eye-slash' : 'pi pi-eye'}"
                                         styleClass="p-button-rounded p-button-text p-button-warning"
                                         title="Activar/Desactivar" actionListener="#{materiaBean.cambiarEstado(m)}"
                                         update="tabla"/>
                        <p:commandButton icon="pi pi-trash" styleClass="p-button-rounded p-button-text p-button-danger"
                                         title="Eliminar" actionListener="#{materiaBean.eliminar(m)}" update="tabla">
                            <p:confirm header="Confirmar" message="Eliminar la materia #{m.codigo}?" icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>

        <p:dialog id="dlg" widgetVar="dlg" header="#{materiaBean.edicion ? 'Editar materia' : 'Nueva materia'}"
                  modal="true" responsive="true" width="480" showEffect="zoom" hideEffect="fade" draggable="false">
            <h:form id="formDlg">
                <div class="p-fluid p-formgrid p-grid">
                    <div class="p-field p-col-12 p-md-6">
                        <p:outputLabel for="codigo" value="Codigo"/>
                        <p:inputText id="codigo" value="#{materiaBean.codigo}" disabled="#{materiaBean.edicion}"
                                     required="true" placeholder="INF999"/>
                    </div>
                    <div class="p-field p-col-12 p-md-6">
                        <p:outputLabel for="tipo" value="Tipo"/>
                        <p:selectOneMenu id="tipo" value="#{materiaBean.tipo}">
                            <f:selectItems value="#{catalogos.tiposMateria}" var="t"
                                           itemLabel="#{t.etiqueta}" itemValue="#{t.codigo}"/>
                        </p:selectOneMenu>
                    </div>
                    <div class="p-field p-col-12">
                        <p:outputLabel for="nombre" value="Nombre"/>
                        <p:inputText id="nombre" value="#{materiaBean.nombre}" required="true"/>
                    </div>
                    <div class="p-field p-col-4">
                        <p:outputLabel for="creditos" value="Creditos"/>
                        <p:inputNumber id="creditos" value="#{materiaBean.creditos}" minValue="1" maxValue="12"/>
                    </div>
                    <div class="p-field p-col-4">
                        <p:outputLabel for="ih" value="Int. horaria"/>
                        <p:inputNumber id="ih" value="#{materiaBean.intensidadHoraria}" minValue="1" maxValue="20"/>
                    </div>
                    <div class="p-field p-col-4">
                        <p:outputLabel for="sem" value="Semestre"/>
                        <p:inputNumber id="sem" value="#{materiaBean.semestre}" minValue="1" maxValue="12"/>
                    </div>
                </div>
                <div style="text-align:right;margin-top:.6rem">
                    <p:commandButton value="Cancelar" icon="pi pi-times" styleClass="p-button-text"
                                     type="button" onclick="PF('dlg').hide()"/>
                    <p:commandButton value="Guardar" icon="pi pi-check" styleClass="p-button-success js-ripple"
                                     action="#{materiaBean.guardar}" update=":form:tabla"
                                     oncomplete="if (!args.validationFailed) PF('dlg').hide()"/>
                </div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
