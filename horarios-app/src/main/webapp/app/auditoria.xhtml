<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition template="/WEB-INF/plantilla/plantilla.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:t="http://tesiscalidad/ui">

    <ui:param name="pageTitle" value="Auditoria"/>

    <ui:define name="contenido">
        <h:form id="form">
            <p:panel styleClass="panel-elevado">
                <f:facet name="header"><i class="pi pi-shield"></i> Traza de auditoria</f:facet>

                <p:toolbar style="margin-bottom:1rem;border:0;background:transparent">
                    <p:toolbarGroup align="right">
                        <p:inputText value="#{auditoriaBean.filtroUsuario}" placeholder="Usuario">
                            <p:ajax event="keyup" listener="#{auditoriaBean.aplicarFiltro}" update="tabla" delay="400"/>
                        </p:inputText>
                        <p:selectOneMenu value="#{auditoriaBean.filtroAccion}" style="margin-left:.5rem">
                            <f:selectItem itemLabel="Todas las acciones" itemValue="#{null}"/>
                            <f:selectItems value="#{auditoriaBean.acciones}"/>
                            <p:ajax listener="#{auditoriaBean.aplicarFiltro}" update="tabla"/>
                        </p:selectOneMenu>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="tabla" value="#{auditoriaBean.modelo}" var="a" lazy="true"
                             paginator="true" rows="15" rowsPerPageTemplate="15,30,60" size="small" stripedRows="true"
                             emptyMessage="Sin registros"
                             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords}"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}">
                    <p:column headerText="Fecha" width="180">#{a.fechaTexto}</p:column>
                    <p:column headerText="Usuario" width="120">#{a.usuario}</p:column>
                    <p:column headerText="Accion" width="150"><t:pill value="#{a.accion}" severity="info"/></p:column>
                    <p:column headerText="Resultado" width="110">
                        <t:pill value="#{a.resultado}" severity="#{a.resultado eq 'EXITO' ? 'success' : 'danger'}"/>
                    </p:column>
                    <p:column headerText="Entidad" width="140">#{a.entidad} #{empty a.entidadId ? '' : ('#'.concat(a.entidadId))}</p:column>
                    <p:column headerText="Detalle">#{a.detalle}</p:column>
                    <p:column headerText="IP" width="120">#{a.ip}</p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
