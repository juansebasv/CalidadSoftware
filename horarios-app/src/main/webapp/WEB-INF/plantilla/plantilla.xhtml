<?xml version="1.0" encoding="UTF-8"?>
<!--
  Plantilla Facelets (mecanismo nativo de JSF, sin librerias de plantilla de
  terceros). Compone topbar + menu lateral + area de contenido y los servicios
  globales de PrimeFaces (growl, confirmacion, blockUI, scrollTop).
-->
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
                xmlns:t="http://tesiscalidad/ui">

<h:head>
    <f:facet name="first">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>#{empty pageTitle ? 'Horarios Docentes' : pageTitle} · Horarios Docentes</title>
    </f:facet>
    <h:outputStylesheet library="css" name="app.css"/>
    <h:outputScript library="js" name="app.js" target="body"/>
</h:head>

<h:body>
    <!-- Notificaciones flotantes (esquina superior derecha) -->
    <p:growl id="avisos" showDetail="true" life="6000" keepAlive="true" escape="false"
             skipDetailIfEqualsSummary="true">
        <p:autoUpdate/>
    </p:growl>
    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true">
        <p:commandButton value="Si" type="button" styleClass="ui-confirmdialog-yes p-button-danger" icon="pi pi-check"/>
        <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no p-button-outlined" icon="pi pi-times"/>
    </p:confirmDialog>

    <div class="layout-topbar">
        <i class="pi pi-calendar" style="font-size:1.4rem"></i>
        <span class="titulo-app">Asignacion de Horarios Docentes</span>
        <span class="spacer"></span>

        <h:form styleClass="tema-form" prependId="false">
            <p:selectOneButton value="#{sesionUsuarioBean.tema}" styleClass="tema-switch">
                <f:selectItem itemLabel="Claro" itemValue="nova-light"/>
                <f:selectItem itemLabel="Color" itemValue="nova-colored"/>
                <f:selectItem itemLabel="Oscuro" itemValue="nova-dark"/>
                <p:ajax event="change" oncomplete="window.location.reload()"/>
                <p:tooltip value="Cambiar tema visual"/>
            </p:selectOneButton>
        </h:form>

        <span class="avatar-mini">#{sesionUsuarioBean.nombre.length() gt 0 ? sesionUsuarioBean.nombre.substring(0,1) : '?'}</span>
        <span>#{sesionUsuarioBean.nombre}</span>
        <t:pill value="#{sesionUsuarioBean.rol}" severity="info"/>

        <h:form prependId="false">
            <p:commandButton value="Salir" icon="pi pi-sign-out" styleClass="p-button-outlined p-button-sm js-ripple"
                             action="#{sesionAcciones.cerrarSesion}" immediate="true"
                             style="color:#fff;border-color:rgba(255,255,255,.6)"/>
        </h:form>
    </div>

    <div class="layout-contenedor">
        <nav class="layout-menu">
            <p:menu>
                <p:submenu label="Panel">
                    <p:menuitem value="Tablero" icon="pi pi-chart-bar" outcome="/app/dashboard"/>
                    <p:menuitem value="Horario / Conflictos" icon="pi pi-calendar-times" outcome="/app/horario"/>
                </p:submenu>
                <p:submenu label="Academico">
                    <p:menuitem value="Materias" icon="pi pi-book" outcome="/app/materias"/>
                    <p:menuitem value="Profesores" icon="pi pi-users" outcome="/app/profesores"/>
                    <p:menuitem value="Perfiles" icon="pi pi-sitemap" outcome="/app/perfiles"/>
                    <p:menuitem value="Disponibilidad" icon="pi pi-clock" outcome="/app/disponibilidad"/>
                    <p:menuitem value="Sesiones de clase" icon="pi pi-calendar-plus" outcome="/app/sesiones"/>
                </p:submenu>
                <p:submenu label="Administracion" rendered="#{sesionUsuarioBean.puedeAdministrarUsuarios}">
                    <p:menuitem value="Usuarios" icon="pi pi-id-card" outcome="/app/usuarios"/>
                </p:submenu>
                <p:submenu label="Seguridad" rendered="#{sesionUsuarioBean.puedeGestionar}">
                    <p:menuitem value="Auditoria" icon="pi pi-shield" outcome="/app/auditoria"/>
                </p:submenu>
            </p:menu>
        </nav>

        <main class="layout-contenido">
            <!-- Banner de mensajes en pagina: alta correcta / errores de negocio / validacion -->
            <p:messages id="mensajesPagina" showSummary="true" showDetail="true" closable="true"
                        styleClass="mensajes-pagina">
                <p:autoUpdate/>
            </p:messages>
            <h:panelGroup layout="block" styleClass="fade-in">
                <ui:insert name="contenido">Contenido</ui:insert>
            </h:panelGroup>
        </main>
    </div>

    <p:ajaxStatus onstart="PF('bloqueoGlobal').show()" oncomplete="PF('bloqueoGlobal').hide()"/>
    <p:blockUI widgetVar="bloqueoGlobal" block="@(body)">
        <i class="pi pi-spin pi-spinner" style="font-size:2rem;color:#fff"></i>
    </p:blockUI>
</h:body>
</html>
